name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run pdf
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
